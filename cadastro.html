<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Notícias</title>
    <link rel="stylesheet" href="./assets/css/cadastro/estilo.css">
    <script src="https://kit.fontawesome.com/f7dc6d9018.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <div class="logo">M</div>
        <h1 class="titulo">Meu site de notícias</h1>
        </div>
    </header>

    <div class="container">
        <h1>Cadastro</h1>
        <form>
            <div class="input-grupo">
                <i class="fa-solid fa-user"></i>
                <input id="nome" type="text" placeholder="Informe seu nome">
            </div>
            <div class="input-grupo">
                <i class="fas fa-envelope"></i>
                <input id="email" type="email" placeholder="Informe seu e-mail">
            </div>
            <div class="input-grupo">
                <i class="fa-solid fa-lock"></i>
                <input id="senha" type="password" placeholder="Informe sua senha">
            </div>
            <button><i class="fas fa-sign-in-alt"></i>Entrar!</button>
        </form>
        <div class="links-auxiliares">
            <a href="index.html">Já tem uma conta?</a>
            <span>-</span> 
            <a href="index.html">Entrar!</a>
        </div>
    </div>
</body>

</html>
